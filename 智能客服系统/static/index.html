<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能母婴客服系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 90%;
            max-width: 800px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            padding: 20px;
            text-align: center;
            color: #333;
        }

        .chat-header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .chat-header p {
            font-size: 14px;
            opacity: 0.8;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
        }

        .message.bot .message-content {
            background: white;
            border: 1px solid #e1e5e9;
            color: #333;
        }

        .message.user .message-content {
            background: #007bff;
            color: white;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            margin: 0 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .message.bot .message-avatar {
            background: #ff9a9e;
            color: white;
        }

        .message.user .message-avatar {
            background: #007bff;
            color: white;
        }

        .chat-input {
            padding: 20px;
            background: white;
            border-top: 1px solid #e1e5e9;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        .input-field {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #e1e5e9;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-field:focus {
            border-color: #007bff;
        }

        .send-button {
            padding: 12px 24px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .send-button:hover {
            background: #0056b3;
        }

        .send-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .typing-indicator {
            display: none;
            padding: 10px 16px;
            color: #666;
            font-style: italic;
            font-size: 12px;
        }

        .quick-questions {
            padding: 10px 20px;
            background: #f8f9fa;
            border-top: 1px solid #e1e5e9;
        }

        .quick-questions h4 {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }

        .question-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .question-btn {
            padding: 6px 12px;
            background: white;
            border: 1px solid #e1e5e9;
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .question-btn:hover {
            background: #007bff;
            color: white;
            border-color: #007bff;
        }

        .error-message {
            background: #ffe6e6;
            color: #d63384;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 12px;
        }

        @media (max-width: 768px) {
            .chat-container {
                width: 100%;
                height: 100vh;
                border-radius: 0;
            }

            .message-content {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🍼 智能母婴客服</h1>
            <p>专业的母婴护理知识问答 • 基于AI的个性化服务</p>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                <div class="message-avatar">🤖</div>
                <div class="message-content">
                    您好！我是您的专属母婴顾问，拥有丰富的专业知识。我可以为您提供：<br>
                    • 备孕与孕期指导<br>
                    • 新生儿护理建议<br>
                    • 喂养与辅食知识<br>
                    • 生长发育咨询<br>
                    • 产品推荐建议<br><br>
                    请随时向我提问！
                </div>
            </div>
        </div>

        <div class="typing-indicator" id="typingIndicator">
            AI正在思考中...
        </div>

        <div class="quick-questions">
            <h4>💡 常见问题</h4>
            <div class="question-buttons">
                <button class="question-btn" onclick="sendQuickQuestion('备孕需要补充叶酸吗？')">备孕营养</button>
                <button class="question-btn" onclick="sendQuickQuestion('新生儿黄疸怎么办？')">新生儿护理</button>
                <button class="question-btn" onclick="sendQuickQuestion('什么时候添加辅食？')">辅食添加</button>
                <button class="question-btn" onclick="sendQuickQuestion('产后恶露多久正常？')">产后恢复</button>
                <button class="question-btn" onclick="sendQuickQuestion('宝宝发烧怎么处理？')">健康安全</button>
                <button class="question-btn" onclick="sendQuickQuestion('推荐一些婴儿用品')">产品推荐</button>
            </div>
        </div>

        <div class="chat-input">
            <div class="input-group">
                <input type="text" class="input-field" id="messageInput" placeholder="请输入您的问题..." maxlength="500">
                <button class="send-button" id="sendButton" onclick="sendMessage()">发送</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://127.0.0.1:8001';
        let sessionId = 'session_' + Date.now();
        let userId = 'user_' + Math.random().toString(36).substr(2, 9);

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            const messageInput = document.getElementById('messageInput');
            messageInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });
        });

        // 发送消息
        async function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const message = messageInput.value.trim();

            if (!message) return;

            // 显示用户消息
            addMessage(message, 'user');
            messageInput.value = '';

            // 禁用发送按钮
            const sendButton = document.getElementById('sendButton');
            sendButton.disabled = true;

            // 显示输入指示器
            showTypingIndicator();

            try {
                const response = await fetch(`${API_BASE_URL}/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        user_id: userId,
                        message: message,
                        session_id: sessionId
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                // 显示AI回复
                addMessage(data.response || '抱歉，我暂时无法回答这个问题。', 'bot');

            } catch (error) {
                console.error('Error:', error);
                addMessage('抱歉，服务暂时不可用。请稍后再试。', 'bot', true);
            } finally {
                // 恢复发送按钮
                sendButton.disabled = false;
                hideTypingIndicator();
            }
        }

        // 快速问题
        function sendQuickQuestion(question) {
            const messageInput = document.getElementById('messageInput');
            messageInput.value = question;
            sendMessage();
        }

        // 添加消息到聊天界面
        function addMessage(content, sender, isError = false) {
            const chatMessages = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;

            const avatar = sender === 'user' ? '👤' : '🤖';
            const messageClass = isError ? 'error-message' : 'message-content';

            messageDiv.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div class="${messageClass}">${content}</div>
            `;

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // 显示输入指示器
        function showTypingIndicator() {
            document.getElementById('typingIndicator').style.display = 'block';
        }

        // 隐藏输入指示器
        function hideTypingIndicator() {
            document.getElementById('typingIndicator').style.display = 'none';
        }

        // 测试API连接
        async function testConnection() {
            try {
                const response = await fetch(`${API_BASE_URL}/health`);
                if (response.ok) {
                    console.log('API连接正常');
                } else {
                    console.warn('API连接异常');
                }
            } catch (error) {
                console.error('无法连接到API服务器:', error);
            }
        }

        // 页面加载时测试连接
        testConnection();
    </script>
</body>
</html>
