name: Build and Push Docker Image
# 测试：v1.0.3

on:
  push:
    branches: [ "main" ] # 只有推送到 main 分支才触发
    tags: [ 'v*' ]      # 推送版本标签（如 v2.1.0）时也触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 设置 Docker Buildx (支持多平台构建和缓存)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1.5. 调试：检查环境变量
      - name: Debug - Check secrets
        run: |
          echo "Username length: ${#DOCKER_USERNAME}"
          echo "Password length: ${#DOCKER_PASSWORD}"
          if [ -z "$DOCKER_USERNAME" ]; then echo "❌ DOCKER_USERNAME is empty"; else echo "✅ DOCKER_USERNAME is set"; fi
          if [ -z "$DOCKER_PASSWORD" ]; then echo "❌ DOCKER_PASSWORD is empty"; else echo "✅ DOCKER_PASSWORD is set"; fi
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      # 2. 登录到 Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. 提取 Docker 标签
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/langgraph-service
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}

      # 4. 构建并推送
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./AIAgent
          file: ./AIAgent/Dockerfile.optimized
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 开启 GitHub 缓存，大幅缩短后续构建时间
          cache-from: type=gha
          cache-to: type=gha,mode=max